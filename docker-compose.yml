# Herramientas de agente para desarrollo. El producto no corre en Docker: el
# Worker se desarrolla con `npm run dev` y se despliega en Cloudflare.
#
#   docker compose up -d --build dsh
#   docker compose logs dsh        # la URL con ?token=... para abrir la UI
services:
  dsh:
    build: ./tools/dsh
    environment:
      # Se lee del .env de la raiz (ignorado por git). Ver .env.example.
      # Basta una de las dos. OPENCODE_API_KEY es la suscripción OpenCode Go; la
      # ruta a Go se declara en el perfil de dsh (skill global dsh-harness).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    # Solo loopback: la UI da ejecucion de comandos a quien tenga el token.
    ports:
      - "127.0.0.1:3080:3081"
    volumes:
      - .:/workspace
      # node_modules propio del contenedor: un `npm install` del agente no debe
      # pisar los binarios de Windows del host (workerd, esbuild).
      - dsh_node_modules:/workspace/node_modules
      - dsh_home:/home/node/.dsh
    restart: unless-stopped

  # Pruebas E2E con Playwright contra el `wrangler dev` del host (no lo levanta).
  # Solo corre a pedido: docker compose run --rm e2e   (ver e2e/ y soma-verificar)
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://host.docker.internal:8787}
      CI: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: host
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

volumes:
  dsh_node_modules:
  dsh_home:
  e2e_node_modules:
