# Textos de la interfaz de SOMA.
#
# Este archivo es la fuente de verdad de la copy: se edita aqui y la interfaz
# cambia sin tocar componentes. Reglas:
#   - No describir funciones que no existan en el backend.
#   - Espanol con tildes correctas.
#   - Las listas mantienen su orden en pantalla.

marca:
  nombre: SOMA
  tagline: Arquitectura que encuentra potencial

# El inicio de sesion lo hace Cloudflare Access antes de llegar a la app
# (ADR-010): aqui solo quedan los estados que la app puede encontrar.
acceso:
  cargando: Verificando tu sesión...
  vencida_titulo: Tu sesión terminó
  vencida_texto: Vuelve a entrar para seguir trabajando. No se perdió nada guardado.
  vencida_boton: Entrar de nuevo ↗
  sin_configurar_titulo: El acceso de administrador no está configurado
  sin_configurar_texto: >-
    Falta conectar Cloudflare Access a esta instalación. Hasta entonces el
    control room permanece cerrado.
  modo_local: MODO LOCAL
  error_titulo: No se pudo verificar la sesión

nav:
  contexto_admin: SOMA / CONTROL ROOM
  contexto_ventas: SOMA / VENTAS
  ver_ventas: Ver ventas ↗
  acceso_admin: Acceso admin ↗
  cerrar_sesion: Cerrar sesión
  contraer: Contraer menú
  expandir: Expandir menú
  secciones:
    - { ruta: /admin, numero: "01", etiqueta: Resumen }
    - { ruta: /admin/insumos, numero: "02", etiqueta: Insumos }
    - { ruta: /admin/apus, numero: "03", etiqueta: APUs }
    - { ruta: /admin/simulador, numero: "04", etiqueta: Simulador }
    - { ruta: /admin/revision, numero: "05", etiqueta: Revisión }
    - { ruta: /admin/orientacion, numero: "06", etiqueta: Orientación }

resumen:
  eyebrow: SOMA / LECTURA OPERATIVA
  titulo_linea1: El proyecto empieza
  titulo_linea2: cuando aparecen
  titulo_enfasis: los patrones.
  estado_activo: CONTROL ROOM ACTIVO
  estado_texto: >-
    Insumos, APUs, simulador y facturas validadas trabajan sobre la misma base.
    Una factura entra solo si sus cifras cuadran.
  ayuda_titulo: De dónde salen estas cifras
  ayuda_texto: >-
    Solo cuentan las facturas cuya suma de renglones coincide con el subtotal y
    el total. Las que no cuadran esperan en Revisión y no afectan el gasto.
  kpis:
    - { etiqueta: Facturas validadas, detalle: Suma verificada renglón a renglón }
    - { etiqueta: Gasto registrado, detalle: Total de facturas validadas }
    - { etiqueta: Proveedores, detalle: Emisores distintos }
    - { etiqueta: En revisión, detalle: No cuadraron; esperan confirmación }
  acciones_eyebrow: SIGUIENTE MOVIMIENTO
  acciones_titulo: Lo que ya puedes trabajar hoy.
  acciones_texto: >-
    Normaliza el catálogo de insumos, arma los análisis de precio unitario y
    proyecta un cronograma con costos reales.
  acciones:
    - { ruta: /admin/apus, etiqueta: Construir un APU ↗, principal: true }
    - { ruta: /admin/insumos, etiqueta: Ordenar insumos }
    - { ruta: /admin/simulador, etiqueta: Simular proyecto }

# Esta sección describía Facturas, Chroma, Inteligencia y DeepSeek: ninguno
# existe en el producto actual. Reescrita para contar lo que sí hace.
orientacion:
  eyebrow: 06 / ORIENTACIÓN
  titulo_linea1: Una guía para
  titulo_linea2: costear
  titulo_enfasis: mejor.
  intro: >-
    SOMA encadena tres momentos: normalizar lo que compras, convertirlo en un
    precio unitario defendible y proyectar cuánto cuesta y cuánto dura la obra.
  pasos:
    - eyebrow: 01 / NORMALIZAR
      titulo: Un insumo, un nombre
      texto: >-
        En Insumos corriges el nombre canónico, la categoría y la unidad. El
        mismo material comprado con diez descripciones distintas se vuelve una
        sola entrada con historial de precio.
      nota: >-
        Editar el catálogo no altera compras pasadas: solo corrige la entrada
        maestra a la que apuntan.
    - eyebrow: 02 / COSTEAR
      titulo: Del insumo al APU
      texto: >-
        En APUs combinas insumos, rendimientos y desperdicios para obtener el
        costo directo de una partida, y le aplicas administración, imprevistos,
        utilidad e IVA.
      nota: >-
        El cálculo lo hace el backend, así que el precio que ves antes de
        guardar es exactamente el que queda guardado.
    - eyebrow: 03 / PROYECTAR
      titulo: Del APU al cronograma
      texto: >-
        En Simulador armas un proyecto con partidas reales. Cada una toma su
        precio del APU y su duración del rendimiento diario, encadenándose en
        el calendario.
      nota: >-
        La duración redondea hacia arriba: media jornada de trabajo ocupa un
        día de obra.
  cierre_eyebrow: LA SECUENCIA SOMA
  cierre_titulo_linea1: Un precio sin respaldo
  cierre_titulo_linea2: es una corazonada.
  cierre_texto: >-
    Lo que no está implementado no aparece como una acción disponible. Esa
    frontera evita prometer flujos que todavía no existen.

ventas:
  hero:
    eyebrow: SOMA / VIVIENDA MULTIFAMILIAR
    titulo_linea1: Una casa.
    titulo_linea2: Varias formas
    titulo_linea3: de
    titulo_enfasis: vivirla.
    descripcion: >-
      Antes de comprar o transformar, entiende el potencial del inmueble. SOMA
      ordena arquitectura, números y decisiones en una primera conversación.
    pasos:
      - { paso: "01", nombre: Leer la casa }
      - { paso: "02", nombre: Proyectar escenarios }
      - { paso: "03", nombre: Decidir con criterio }
  simulador:
    eyebrow: SOMA / PRIMERA CUENTA
    titulo_linea1: ¿Qué podría sostener
    titulo_enfasis: la transformación?
    descripcion: >-
      Compara área, unidades, calidad de obra y renta para tener una primera
      referencia. No es un avalúo ni una promesa de rentabilidad.
    # Etiquetas cortas a proposito: en dos columnas estrechas, un texto largo
    # se parte en tres lineas y el formulario deja de leerse.
    campos:
      area: Área (m²)
      unidades: Unidades
      calidad: Calidad
      compra: Compra (COP)
      renta: Renta / unidad
      gastos: Gastos / mes
    boton: Ver escenario ↗
    calculando: Calculando…
    resultado_eyebrow: ESCENARIO PRELIMINAR
    kpis:
      inversion: Inversión total
      flujo: Flujo neto anual
      roi: ROI anual
      payback: Payback
  film:
    eyebrow: SOMA / CONTEXTO
    titulo_linea1: La idea no es ver el dron.
    titulo_linea2: Es ver lo que puede llegar a ser.
  existente:
    eyebrow: FASE 1 / CASA EXISTENTE
    titulo_linea1: Lo que ya tienes
    titulo_enfasis: también funciona.
    descripcion: >-
      Antes de imaginar una transformación, leemos la base: estructura,
      distribución, iluminación, jardín y posibilidades reales de adaptación.
    pie: Vista de lectura inicial · casa unifamiliar en Bogotá

# El asesor vive en un globo flotante, no en una sección de la página.
asesor:
  burbuja_abrir: Hablar con el asesor
  burbuja_cerrar: Cerrar
  reiniciar: Reiniciar la conversación
  titulo: Asesor SOMA
  subtitulo: Orientación preliminar
  estado_activo: en línea
  estado_ocupado: analizando
  bienvenida: >-
    Soy el asesor de SOMA. Cuéntame qué inmueble tienes o qué te gustaría
    estudiar.
  sugerencias:
    - Quiero convertir una casa de 180 m² en 3 apartamentos
    - ¿Cómo se arma el presupuesto de una remodelación?
    - ¿Qué es un APU y para qué sirve?
  placeholder: Escribe tu pregunta...
  enviar: Enviar ↗
  error_prefijo: "No pude completar la asesoría:"
  # Cuando se agota el cupo diario del asesor (lo escribe el Worker).
  agotado: >-
    Por hoy ya respondí todas las consultas que puedo. Escríbenos por WhatsApp
    y te atendemos directamente.
  # Numero con indicativo, solo digitos (p. ej. 573001234567). Vacio = sin enlace.
  whatsapp: ""

# Textos comunes de la ventana de chat (asesor y copiloto).
asistente:
  aviso: El asistente puede equivocarse. Verifica las cifras en la herramienta.
  abrir: Abrir asistente
  cerrar: Cerrar asistente
  copiar: Copiar
  copiado: Copiado
  simulador_lleno: Listo, llené el simulador con esos datos. Pulsa «Ver escenario» para ver el resultado.
  seccion_abierta: Listo, abrí la sección

# Copiloto del control room: globo flotante en todas las secciones.
copiloto:
  titulo: Copiloto SOMA
  bienvenida: >-
    Puedo buscar insumos y precios, resumir cómo va el negocio o llevarte a la
    sección que necesites.
  placeholder: Pregunta o pide una sección...

revision:
  eyebrow: FACTURAS EN REVISIÓN
  titulo: Documentos que no cerraron solos
  intro: >-
    La ingesta no acepta una factura cuyas cifras no cuadran. Estas quedaron
    esperando confirmación, con lo que sí se pudo leer ya cargado.
  vacio: No hay facturas esperando revisión.
  columna_archivo: Archivo
  columna_emisor: Emisor
  columna_items: Renglones
  columna_total: Total leído
  columna_motivo: Por qué no cerró
  ver_detalle: Ver renglones
  ocultar_detalle: Ocultar
  sin_extraccion: >-
    De este documento no se guardó la lectura. Se procesó antes de que la
    ingesta empezara a conservarla; volver a pasarlo la genera.
  sin_items: El parser no pudo separar los renglones de este documento.
  detalle_subtotal: Subtotal
  detalle_iva: IVA
  detalle_total: Total
  error_carga: No se pudieron cargar las facturas en revisión.
  carga_eyebrow: CARGAR FACTURAS
  carga_titulo: Sube los PDF de tus proveedores
  carga_texto: >-
    Se leen aquí mismo, en tu navegador. Si las cifras cuadran entran directo;
    si no, quedan abajo esperando tu revisión. Subir dos veces el mismo archivo
    no lo duplica.
  carga_boton: Elegir PDF…
  carga_leyendo: Leyendo
  carga_validada: Validada
  carga_revision: En revisión
  carga_duplicada: Ya estaba cargada
  carga_error: Error
  aprobar_titulo: Corrige lo que se leyó mal y confirma
  aprobar_texto: >-
    La factura solo entra si la suma de renglones da el subtotal y subtotal más
    IVA da el total. Los importes se escriben sin separador de miles, con punto
