resumen:
  eyebrow: SOMA / LECTURA OPERATIVA
  titulo_linea1: El proyecto empieza
  titulo_linea2: cuando aparecen
  titulo_enfasis: los patrones.
  estado_activo: CONTROL ROOM ACTIVO
  estado_texto: >-
    Insumos, APUs, simulador y facturas validadas trabajan sobre la misma base.
    Una factura entra solo si sus cifras cuadran.
  ayuda_titulo: De dónde salen estas cifras
  ayuda_texto: >-
    Solo cuentan las facturas cuya suma de renglones coincide con el subtotal y
    el total. Las que no cuadran esperan en Revisión y no afectan el gasto.
  kpis:
    - { etiqueta: Facturas validadas, detalle: Suma verificada renglón a renglón }
    - { etiqueta: Gasto registrado, detalle: Total de facturas validadas }
    - { etiqueta: Proveedores, detalle: Emisores distintos }
    - { etiqueta: En revisión, detalle: No cuadraron; esperan confirmación }
  acciones_eyebrow: SIGUIENTE MOVIMIENTO
  acciones_titulo: Lo que ya puedes trabajar hoy.
  acciones_texto: >-
    Normaliza el catálogo de insumos, arma los análisis de precio unitario y
    proyecta un cronograma con costos reales.
  acciones:
    - { ruta: /admin/apus, etiqueta: Construir un APU ↗, principal: true }
    - { ruta: /admin/insumos, etiqueta: Ordenar insumos }
    - { ruta: /admin/simulador, etiqueta: Simular proyecto }
  # Quienes dejaron nombre y correo antes de abrir el asesor publico.
  contactos:
    eyebrow: ASESOR PÚBLICO
    titulo: Quién quiso conversar
    caption: ÚLTIMOS 50
    vacio: Todavía nadie ha abierto el asesor del sitio.
    visitas: visita(s)

# Esta sección describía Facturas, Chroma, Inteligencia y DeepSeek: ninguno
# existe en el producto actual. Reescrita para contar lo que sí hace.
orientacion:
  eyebrow: 07 / ORIENTACIÓN
  titulo_linea1: Una guía para
  titulo_linea2: costear
  titulo_enfasis: mejor.
  intro: >-
    SOMA encadena tres momentos: normalizar lo que compras, convertirlo en un
    precio unitario defendible y proyectar cuánto cuesta y cuánto dura la obra.
  pasos:
    - eyebrow: 01 / NORMALIZAR
      titulo: Un insumo, un nombre
      texto: >-
        En Insumos corriges el nombre canónico, la categoría y la unidad. El
        mismo material comprado con diez descripciones distintas se vuelve una
        sola entrada con historial de precio.
      nota: >-
        Editar el catálogo no altera compras pasadas: solo corrige la entrada
        maestra a la que apuntan.
    - eyebrow: 02 / COSTEAR
      titulo: Del insumo al APU
      texto: >-
        En APUs combinas insumos, rendimientos y desperdicios para obtener el
        costo directo de una partida, y le aplicas administración, imprevistos,
        utilidad e IVA.
      nota: >-
        El cálculo lo hace el backend, así que el precio que ves antes de
        guardar es exactamente el que queda guardado.
    - eyebrow: 03 / PROYECTAR
      titulo: Del APU al cronograma
      texto: >-
        En Simulador armas un proyecto con partidas reales. Cada una toma su
        precio del APU y su duración del rendimiento diario, encadenándose en
        el calendario.
      nota: >-
        La duración redondea hacia arriba: media jornada de trabajo ocupa un
        día de obra.
  cierre_eyebrow: LA SECUENCIA SOMA
  cierre_titulo_linea1: Un precio sin respaldo
  cierre_titulo_linea2: es una corazonada.
  cierre_texto: >-
    Lo que no está implementado no aparece como una acción disponible. Esa
    frontera evita prometer flujos que todavía no existen.

