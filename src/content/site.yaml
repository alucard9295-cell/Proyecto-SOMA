# Textos de la interfaz de SOMA.
#
# Este archivo es la fuente de verdad de la copy: se edita aqui y la interfaz
# cambia sin tocar componentes. Reglas:
#   - No describir funciones que no existan en el backend.
#   - Espanol con tildes correctas.
#   - Las listas mantienen su orden en pantalla.

