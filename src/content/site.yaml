  instagram: ""
  facebook: ""

# El asesor vive en un globo flotante, no en una sección de la página. Se
# presenta como "Agente SOMA"; firma es la etiqueta en dos líneas del lanzador.
asesor:
  titulo: Agente SOMA
  firma:
    antes: Agente
    nombre: SOMA
  subtitulo: orientación preliminar
  bienvenida: >-
    Soy el agente de SOMA. Cuéntame qué inmueble tienes o qué te gustaría
    estudiar.
  sugerencias:
    - Quiero convertir una casa de 180 m² en 3 apartamentos
    - ¿Cómo se arma el presupuesto de una remodelación?
    - ¿Qué es un APU y para qué sirve?
  placeholder: Escribe tu pregunta...
  # Paso previo: nombre y correo antes de abrir el chat (ADR-012).
  previo:
    eyebrow: AGENTE SOMA
    titulo: Antes de empezar,
    titulo_enfasis: ¿cómo te llamas?
    texto: >-
      Déjanos tu nombre y correo para poder retomar la conversación contigo si
      el escenario te interesa.
    nombre: Nombre
    correo: Correo electrónico
    autoriza: >-
      Autorizo a SOMA a guardar mi nombre y correo para responder esta
      consulta (Ley 1581 de 2012). No los compartimos con nadie.
    boton: Empezar a chatear ↗
    enviando: Guardando…
    cerrar: Cerrar
  # Tocar el Vitruvio despliega en arco el chat, WhatsApp y correo.
  # WhatsApp solo aparece si contacto.whatsapp tiene numero.
  menu:
    etiqueta: Formas de contacto
    contacto: Contactar a SOMA
    whatsapp: WhatsApp
    correo: Correo
    chat: Hablar con el agente
  # El mismo formulario del paso previo, sin chat: deja nombre y correo en D1.
  correo:
    titulo: Te escribimos
    titulo_enfasis: nosotros.
    texto: >-
      Déjanos tu nombre y correo, y SOMA te responde por ese medio.
    boton: Enviar mis datos ↗
    gracias: >-
      Recibimos tus datos. SOMA te escribirá a ese correo.
  # Cuando se agota el cupo diario del asesor (lo escribe el Worker).
  agotado: >-
    Por hoy ya respondí todas las consultas que puedo. Escríbenos por WhatsApp
    y te atendemos directamente.

