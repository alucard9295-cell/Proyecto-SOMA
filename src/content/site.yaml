  aprobar_boton: Confirmar factura
  agregar_renglon: + Renglón
  quitar_renglon: Quitar renglón
  descartar_boton: Descartar documento
  descartar_motivo: Motivo para descartarlo
  campo_proveedor: Proveedor
  campo_nit: NIT emisor
  campo_fecha: Fecha
  campo_cufe: CUFE

